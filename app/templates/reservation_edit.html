{% extends 'base.html' %}{% block heading %}Editar reserva{% endblock %}{% block content %}<div class="page-actions"><div><h2>Editar reserva #{{ r.id }}</h2><p>Atualize o título, o leitor ou a situação.</p></div><a class="btn btn-light" href="{{ url_for('main.reservations') }}">Voltar</a></div><form method="post" class="panel form-panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><div><label>Título</label><select class="form-select" name="book_id" required>{% for b in books %}<option value="{{ b.id }}" {% if r.book_id==b.id %}selected{% endif %}>{{ b.title }}</option>{% endfor %}</select></div><div><label>Leitor</label><select class="form-select" name="borrower_id" required>{% for b in borrowers %}<option value="{{ b.id }}" {% if r.borrower_id==b.id %}selected{% endif %}>{{ b.name }}</option>{% endfor %}</select></div><div><label>Status</label><select class="form-select" name="status">{% for st in ['Pendente','Atendida','Cancelada'] %}<option value="{{ st }}" {% if r.status==st %}selected{% endif %}>{{ st }}</option>{% endfor %}</select></div></div><div class="form-footer"><button class="btn btn-primary">Salvar alterações</button></div></form>{% endblock %}
