{% extends 'base.html' %}{% block heading %}Detalhes do exemplar{% endblock %}{% block content %}<div class="page-actions"><div><h2>{{ copy.book.title }}</h2><p>{{ copy.book.author }} · Código {{ copy.barcode }}</p></div><a class="btn btn-light" href="{{ url_for('main.books') }}">Voltar ao acervo</a></div><form method="post" class="panel form-panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><div><label>Status</label><select class="form-select" name="status">{% for s in ['Disponível','Emprestado','Em manutenção','Em avaliação','Reservado','Extraviado','Descartado'] %}<option {{ 'selected' if copy.status==s }}>{{ s }}</option>{% endfor %}</select></div><div><label>Conservação</label><select class="form-select" name="condition">{% for s in ['Excelente','Bom','Regular','Ruim','Necessita de restauração'] %}<option {{ 'selected' if copy.condition==s }}>{{ s }}</option>{% endfor %}</select></div><div><label>Localização</label><input class="form-control" name="location" value="{{ copy.location or '' }}"></div><div><label>Próxima avaliação</label><input class="form-control" value="{{ copy.next_evaluation or 'Não definida' }}" disabled></div><div class="span-2"><label>Observações de danos</label><textarea class="form-control" name="damage_notes">{{ copy.damage_notes or '' }}</textarea></div></div><div class="form-footer"><button class="btn btn-primary">Salvar alterações</button></div></form><form method="post" action="{{ url_for('main.copy_delete',copy_id=copy.id) }}" class="mt-3" onsubmit="return confirm('Excluir este exemplar?')"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-outline-danger">Excluir exemplar</button></form>{% endblock %}
